name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish results to the benchmark-results branch
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: all benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout credentials are not persisted
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ! git config --local --get-regexp '^http\..*\.extraheader$'
          ! git remote get-url origin | grep -Eq '(x-access-token|github_pat_|gh[opsu]_)'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve latest wolfSSL commit
        id: wolfssl
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/wolfSSL/wolfssl.git refs/heads/master | cut -f1)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Restore wolfSSL cache
        id: cache-wolfssl
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/wolfssl
            ${{ runner.temp }}/wolfssl-build
          key: wolfssl-${{ runner.os }}-${{ runner.arch }}-release-static-v1-${{ steps.wolfssl.outputs.commit }}
          restore-keys: |
            wolfssl-${{ runner.os }}-${{ runner.arch }}-release-static-v1-
      - name: Build wolfSSL
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          WOLFSSL_CACHE_HIT: ${{ steps.cache-wolfssl.outputs.cache-hit }}
          WOLFSSL_SOURCE: ${{ runner.temp }}/wolfssl
          WOLFSSL_BUILD: ${{ runner.temp }}/wolfssl-build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WOLFSSL_CACHE_HIT" == true ]] &&
             [[ "$(git -C "$WOLFSSL_SOURCE" rev-parse HEAD)" == "$WOLFSSL_COMMIT" ]] &&
             [[ -x "$WOLFSSL_BUILD/examples/server/server" ]] &&
             [[ -x "$WOLFSSL_BUILD/examples/client/client" ]]; then
            exit 0
          fi
          if [[ ! -d "$WOLFSSL_SOURCE/.git" ]]; then
            rm -rf "$WOLFSSL_SOURCE" "$WOLFSSL_BUILD"
            git init "$WOLFSSL_SOURCE"
            git -C "$WOLFSSL_SOURCE" remote add origin https://github.com/wolfSSL/wolfssl.git
          fi
          git -C "$WOLFSSL_SOURCE" fetch --depth 1 origin "$WOLFSSL_COMMIT"
          git -C "$WOLFSSL_SOURCE" checkout --detach FETCH_HEAD
          cmake -S "$WOLFSSL_SOURCE" -B "$WOLFSSL_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWOLFSSL_AESCCM=yes \
            -DWOLFSSL_CURVE25519=yes \
            -DWOLFSSL_DTLS=yes \
            -DWOLFSSL_DTLS13=yes \
            -DWOLFSSL_DTLS_CH_FRAG=yes \
            -DWOLFSSL_DTLS_CID=yes \
            -DWOLFSSL_EARLYDATA=yes \
            -DWOLFSSL_EXAMPLES=yes \
            -DWOLFSSL_MLKEM=yes \
            -DWOLFSSL_POSTAUTH=yes \
            -DWOLFSSL_PSK=yes \
            -DWOLFSSL_SESSIONCERTS=yes \
            -DWOLFSSL_SESSION_TICKET=yes \
            -DWOLFSSL_TLS13=yes
          cmake --build "$WOLFSSL_BUILD" --parallel 2
          test -x "$WOLFSSL_BUILD/examples/server/server"
          test -x "$WOLFSSL_BUILD/examples/client/client"
      - name: Save wolfSSL cache
        if: steps.cache-wolfssl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/wolfssl
            ${{ runner.temp }}/wolfssl-build
          key: ${{ steps.cache-wolfssl.outputs.cache-primary-key }}
      - name: Run wolfSSL interoperability matrix
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          WOLFSSL_ROOT: ${{ runner.temp }}/wolfssl
          WOLFSSL_SERVER: ${{ runner.temp }}/wolfssl-build/examples/server/server
          WOLFSSL_CLIENT: ${{ runner.temp }}/wolfssl-build/examples/client/client
        shell: bash
        run: |
          set -euo pipefail
          count=10
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            count=1
          fi
          test "$(git -C "$WOLFSSL_ROOT" rev-parse HEAD)" = "$WOLFSSL_COMMIT"
          test -x "$WOLFSSL_SERVER"
          test -x "$WOLFSSL_CLIENT"
          go test . -run '^TestInteropWolfSSL' -v -count="$count" -timeout=45m
      - name: Run paired PR performance gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export GOMAXPROCS=1
          base_dir="$RUNNER_TEMP/go-dtls-base"
          base_binary="$RUNNER_TEMP/go-dtls-base.test"
          head_binary="$RUNNER_TEMP/go-dtls-head.test"
          base_output="$RUNNER_TEMP/benchmark-base.txt"
          head_output="$RUNNER_TEMP/benchmark-head.txt"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          trap 'git worktree remove --force "$base_dir" >/dev/null 2>&1 || true' EXIT
          go test -c -o "$head_binary" .
          (
            cd "$base_dir"
            go test -c -o "$base_binary" .
          )
          workload_changed=false
          while IFS= read -r path; do
            if [[ "$path" == handshake_end_to_end_test.go || "$path" == ech_test.go ]] ||
               git show "$BASE_SHA:$path" 2>/dev/null | grep -q '^func Benchmark' ||
               { [[ -f "$path" ]] && grep -q '^func Benchmark' "$path"; }; then
              workload_changed=true
              break
            fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*_test.go')
          printf 'commit: %s\nworkload-changed: %s\n' "$BASE_SHA" "$workload_changed" > "$base_output"
          printf 'commit: %s\nworkload-changed: %s\n' "$HEAD_SHA" "$workload_changed" > "$head_output"
          lifecycle='^(BenchmarkConnectionHandshakeLifecycle|BenchmarkSessionTicketRequestHandshakeLifecycle|BenchmarkGREASEHandshakeLifecycle|BenchmarkECHHandshakeLifecycle|BenchmarkExternalPSKHandshakeLifecycle|BenchmarkMutualTLSHandshakeLifecycle|BenchmarkCertificateSelectionHandshakeLifecycle|BenchmarkCertificateCompressionHandshakeLifecycle|BenchmarkHybridKeyExchangeHandshakeLifecycle)$'
          records='^BenchmarkProtectedRecord(Seal|RoundTripInPlace)$'
          run_suite() {
            local binary="$1" output="$2" directory="$3"
            (
              cd "$directory"
              "$binary" -test.run='^$' -test.bench="$lifecycle" -test.benchmem -test.benchtime=500x -test.count=1 -test.cpu=1 -test.timeout=20m | tee -a "$output"
              "$binary" -test.run='^$' -test.bench="$records" -test.benchmem -test.benchtime=100000x -test.count=1 -test.cpu=1 -test.timeout=20m | tee -a "$output"
            )
          }
          warm_up() {
            local binary="$1" directory="$2"
            (
              cd "$directory"
              "$binary" -test.run='^$' -test.bench="$lifecycle" -test.benchtime=1x -test.count=1 -test.cpu=1 -test.timeout=20m >/dev/null
              "$binary" -test.run='^$' -test.bench="$records" -test.benchtime=1x -test.count=1 -test.cpu=1 -test.timeout=20m >/dev/null
            )
          }
          warm_up "$base_binary" "$base_dir"
          warm_up "$head_binary" "$GITHUB_WORKSPACE"
          for pair in $(seq 1 9); do
            if (( pair % 2 == 1 )); then
              run_suite "$base_binary" "$base_output" "$base_dir"
              run_suite "$head_binary" "$head_output" "$GITHUB_WORKSPACE"
            else
              run_suite "$head_binary" "$head_output" "$GITHUB_WORKSPACE"
              run_suite "$base_binary" "$base_output" "$base_dir"
            fi
          done
          cp "$base_output" benchmark-base.txt
          cp "$head_output" benchmark-head.txt
          printf 'workload-changed=%s\n' "$workload_changed"
      - name: Run all benchmarks
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          WOLFSSL_SOURCE: ${{ runner.temp }}/wolfssl
          WOLFSSL_BUILD: ${{ runner.temp }}/wolfssl-build
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit: %s\nwolfssl: %s (Linux Release static)\n' \
            "$(git rev-parse HEAD)" "$WOLFSSL_COMMIT" > benchmark.txt
          go version >> benchmark.txt
          go test . -run '^$' -bench . -benchmem -count=5 -cpu=1 -timeout=45m | tee -a benchmark.txt
          WOLFSSL_ROOT="$WOLFSSL_SOURCE" \
          WOLFSSL_SERVER="$WOLFSSL_BUILD/examples/server/server" \
          WOLFSSL_CLIENT="$WOLFSSL_BUILD/examples/client/client" \
            go test . -run '^$' \
              -bench '^(BenchmarkWolfSSLFeatureRealUDP|BenchmarkHybridKeyExchangeRealUDP)$' \
              -benchmem -benchtime=1x -count=5 -cpu=1 -timeout=45m -json | tee -a benchmark.txt
      - name: Format and sort benchmark report
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          ALLOW_WORKLOAD_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'performance-workload-approved') }}
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/benchmark-report"
          go build -o "$tool" ./tools/benchmark-report
          common=(
            -input benchmark.txt
            -commit "$(git rev-parse HEAD)"
            -generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            -wolfssl "$WOLFSSL_COMMIT (Linux Release static)"
          )
          "$tool" "${common[@]}" -language zh-CN -output README.md
          "$tool" "${common[@]}" -language en -output benchmark.en.md
          "$tool" "${common[@]}" -language ru -output benchmark.ru.md
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            set +e
            "$tool" \
              -baseline benchmark-base.txt \
              -candidate benchmark-head.txt \
              -output benchmark-comparison.md \
              -language zh-CN \
              -minimum-pairs 9 \
              -time-regression-percent 5 \
              -allow-workload-change "${ALLOW_WORKLOAD_CHANGE:-false}" \
              -fail-on-regression=true
            status=$?
            set -e
            if [[ ! -f benchmark-comparison.md ]]; then
              printf '## PR base/head 配对性能门禁\n\n比较工具失败，详见 workflow 日志。\n' > benchmark-comparison.md
            fi
            printf '%s\n' "$status" > performance-gate-status.txt
            cat benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
          cat README.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-output
          path: |
            README.md
            benchmark.en.md
            benchmark.ru.md
            benchmark.txt
            benchmark-base.txt
            benchmark-head.txt
            benchmark-comparison.md
            performance-gate-status.txt
          retention-days: 30
          if-no-files-found: error
      - name: Enforce paired PR performance gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: test "$(cat performance-gate-status.txt)" = 0

  publish:
    name: publish master results
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master')
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-output
          path: report
      - name: Update benchmark-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/benchmark-results"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --depth 1 --branch benchmark-results "$remote" "$target"; then
            rm -rf "$target"
            git init -b benchmark-results "$target"
            git -C "$target" remote add origin "$remote"
          fi
          cp report/README.md "$target/README.md"
          cp report/benchmark.en.md report/benchmark.ru.md "$target/"
          cp report/benchmark.txt "$target/benchmark.txt"
          printf '\n[Go benchmark 原始输出](benchmark.txt)\n' >> "$target/README.md"
          printf '\n[Raw Go benchmark output](benchmark.txt)\n' >> "$target/benchmark.en.md"
          printf '\n[Исходный вывод Go benchmark](benchmark.txt)\n' >> "$target/benchmark.ru.md"
          git -C "$target" rm -f --ignore-unmatch benchmark.md
          git -C "$target" config user.name github-actions[bot]
          git -C "$target" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$target" add README.md benchmark.en.md benchmark.ru.md benchmark.txt
          if git -C "$target" diff --cached --quiet; then
            exit 0
          fi
          git -C "$target" commit -m "bench(results): update for ${GITHUB_SHA}"
          git -C "$target" push origin HEAD:benchmark-results
