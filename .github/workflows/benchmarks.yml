name: Benchmarks

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish results to the benchmark-results branch
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: retained benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout credentials are not persisted
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ! git config --local --get-regexp '^http\..*\.extraheader$'
          ! git remote get-url origin | grep -Eq '(x-access-token|github_pat_|gh[opsu]_)'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go benchmarks
        id: go_bench
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/benchmark-output/benchmark.txt"
          mkdir -p "$(dirname "$output")"
          printf 'commit: %s\n' "$(git rev-parse HEAD)" > "$output"
          go version >> "$output"
          go test . -run '^$' -bench . -skip '^BenchmarkEarlyDataHandshakeLifecycle$' -benchmem -count=5 -cpu=1 -timeout=45m | tee -a "$output"
          go test . -run '^$' -bench '^BenchmarkEarlyDataHandshakeLifecycle$' -benchtime=2000x -benchmem -count=5 -cpu=1 -timeout=45m | tee -a "$output"
      - name: Resolve latest wolfSSL commit
        id: wolfssl
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git ls-remote https://github.com/wolfSSL/wolfssl.git refs/heads/master | cut -f1)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Restore wolfSSL cache
        id: cache-wolfssl
        if: steps.wolfssl.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/wolfssl
            ${{ runner.temp }}/wolfssl-build
          key: wolfssl-${{ runner.os }}-${{ runner.arch }}-release-static-v4-${{ steps.wolfssl.outputs.commit }}
          restore-keys: |
            wolfssl-${{ runner.os }}-${{ runner.arch }}-release-static-v4-
      - name: Build wolfSSL
        id: build_wolfssl
        if: steps.wolfssl.outcome == 'success'
        continue-on-error: true
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          WOLFSSL_CACHE_HIT: ${{ steps.cache-wolfssl.outputs.cache-hit }}
          WOLFSSL_SOURCE: ${{ runner.temp }}/wolfssl
          WOLFSSL_BUILD: ${{ runner.temp }}/wolfssl-build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WOLFSSL_CACHE_HIT" == true ]] &&
             [[ "$(git -C "$WOLFSSL_SOURCE" rev-parse HEAD)" == "$WOLFSSL_COMMIT" ]] &&
             [[ -x "$WOLFSSL_BUILD/examples/server/server" ]] &&
             [[ -x "$WOLFSSL_BUILD/examples/client/client" ]]; then
            exit 0
          fi
          if [[ ! -d "$WOLFSSL_SOURCE/.git" ]]; then
            rm -rf "$WOLFSSL_SOURCE" "$WOLFSSL_BUILD"
            git init "$WOLFSSL_SOURCE"
            git -C "$WOLFSSL_SOURCE" remote add origin https://github.com/wolfSSL/wolfssl.git
          fi
          git -C "$WOLFSSL_SOURCE" fetch --depth 1 origin "$WOLFSSL_COMMIT"
          git -C "$WOLFSSL_SOURCE" checkout --detach FETCH_HEAD
          cmake -S "$WOLFSSL_SOURCE" -B "$WOLFSSL_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-DHAVE_RPK \
            -DHAVE_RPK=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWOLFSSL_AESCCM=yes \
            -DWOLFSSL_ALPN=yes \
            -DWOLFSSL_CURVE25519=yes \
            -DWOLFSSL_DTLS=yes \
            -DWOLFSSL_DTLS13=yes \
            -DWOLFSSL_DTLS_CH_FRAG=yes \
            -DWOLFSSL_DTLS_CID=yes \
            -DWOLFSSL_DTLS_MTU=yes \
            -DWOLFSSL_EARLYDATA=yes \
            -DWOLFSSL_ECH=yes \
            -DWOLFSSL_ED25519=yes \
            -DWOLFSSL_EXAMPLES=yes \
            -DWOLFSSL_HPKE=yes \
            -DWOLFSSL_KEYING_MATERIAL=yes \
            -DWOLFSSL_MLKEM=yes \
            -DWOLFSSL_OCSP=yes \
            -DWOLFSSL_OCSPSTAPLING=yes \
            -DWOLFSSL_POSTAUTH=yes \
            -DWOLFSSL_PSK=yes \
            -DWOLFSSL_SESSIONCERTS=yes \
            -DWOLFSSL_SESSION_TICKET=yes \
            -DWOLFSSL_SNI=yes \
            -DWOLFSSL_TLS13=yes
          cmake --build "$WOLFSSL_BUILD" --target wolfssl server client --parallel 2
          test -x "$WOLFSSL_BUILD/examples/server/server"
          test -x "$WOLFSSL_BUILD/examples/client/client"
      - name: Save wolfSSL cache
        if: steps.build_wolfssl.outcome == 'success' && steps.cache-wolfssl.outcome == 'success' && steps.cache-wolfssl.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/wolfssl
            ${{ runner.temp }}/wolfssl-build
          key: ${{ steps.cache-wolfssl.outputs.cache-primary-key }}
      - name: Run wolfSSL benchmarks
        id: peer_bench
        if: steps.build_wolfssl.outcome == 'success'
        continue-on-error: true
        env:
          WOLFSSL_COMMIT: ${{ steps.wolfssl.outputs.commit }}
          WOLFSSL_SOURCE: ${{ runner.temp }}/wolfssl
          WOLFSSL_BUILD: ${{ runner.temp }}/wolfssl-build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$WOLFSSL_SOURCE" rev-parse HEAD)" = "$WOLFSSL_COMMIT"
          output="$RUNNER_TEMP/benchmark-output/benchmark.txt"
          printf 'wolfssl: %s (Linux Release static)\n' "$WOLFSSL_COMMIT" >> "$output"
          WOLFSSL_ROOT="$WOLFSSL_SOURCE" \
          WOLFSSL_SERVER="$WOLFSSL_BUILD/examples/server/server" \
          WOLFSSL_CLIENT="$WOLFSSL_BUILD/examples/client/client" \
            go test . -run '^$' \
              -bench '^(BenchmarkWolfSSLFeatureRealUDP|BenchmarkHybridKeyExchangeRealUDP)$' \
              -benchmem -benchtime=1x -count=5 -cpu=1 -timeout=45m -json | tee -a "$output"
      - name: Restore DTLS 1.3 peer build cache
        id: cache-dtls-peers
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/dtls13-peers
          key: dtls13-peers-${{ runner.os }}-${{ runner.arch }}-b9283c1e-4f3b183c-41eecc7c-v1
      - name: Build pinned NSS, BoringSSL, and OpenSSL peers
        id: build_dtls_peers
        continue-on-error: true
        env:
          PEER_WORK: ${{ runner.temp }}/dtls13-peers
          PEER_CACHE_HIT: ${{ steps.cache-dtls-peers.outputs.cache-hit }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libnspr4-dev pkg-config
          nss_sha=b9283c1e4ee232b4450d36115272af670d38ec81
          bssl_sha=4f3b183c5d4a8f8fcaba4c0ab4435df181df6978
          openssl_sha=41eecc7c7cd4069b1b29bca49b9d97825c6bf648
          if [[ "$PEER_CACHE_HIT" != true ]] ||
             [[ "$(git -C "$PEER_WORK/nss" rev-parse HEAD 2>/dev/null || true)" != "$nss_sha" ]] ||
             [[ "$(git -C "$PEER_WORK/bssl" rev-parse HEAD 2>/dev/null || true)" != "$bssl_sha" ]] ||
             [[ "$(git -C "$PEER_WORK/openssl" rev-parse HEAD 2>/dev/null || true)" != "$openssl_sha" ]] ||
             [[ ! -f "$PEER_WORK/bssl-build/libssl.a" ]] ||
             [[ ! -f "$PEER_WORK/openssl/libssl.so" ]] ||
             [[ -z "$(find "$PEER_WORK/dist" -name libnss3.so -print -quit 2>/dev/null)" ]]; then
            rm -rf "$PEER_WORK"
            mkdir -p "$PEER_WORK"
            for entry in \
              "nss https://github.com/nss-dev/nss $nss_sha" \
              "bssl https://github.com/google/boringssl $bssl_sha" \
              "openssl https://github.com/openssl/openssl $openssl_sha"; do
              read -r name url sha <<< "$entry"
              git init "$PEER_WORK/$name"
              git -C "$PEER_WORK/$name" remote add origin "$url"
              git -C "$PEER_WORK/$name" fetch --depth 1 origin "$sha"
              git -C "$PEER_WORK/$name" checkout --detach FETCH_HEAD
            done
            (cd "$PEER_WORK/openssl" && ./Configure no-tests && make -j2)
            cmake -S "$PEER_WORK/bssl" -B "$PEER_WORK/bssl-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
            cmake --build "$PEER_WORK/bssl-build" --parallel 2
            make -C "$PEER_WORK/nss" -j1 all USE_64=1 BUILD_OPT=1 NSS_DISABLE_GTESTS=1 \
              NSPR_INCLUDE_DIR="$(pkg-config --variable=includedir nspr)" \
              NSPR_LIB_DIR="$(pkg-config --variable=libdir nspr)"
            make -C "$PEER_WORK/nss" latest USE_64=1 BUILD_OPT=1
          fi
          test "$(git -C "$PEER_WORK/nss" rev-parse HEAD)" = "$nss_sha"
          test "$(git -C "$PEER_WORK/bssl" rev-parse HEAD)" = "$bssl_sha"
          test "$(git -C "$PEER_WORK/openssl" rev-parse HEAD)" = "$openssl_sha"
          nsslib="$(find "$PEER_WORK/dist" -name libnss3.so -printf '%h\n' -quit)"
          test -n "$nsslib"
          cc -O2 -Wall -Wextra -Werror -I"$PEER_WORK/openssl/include" \
            testdata/interop/openssl.c -L"$PEER_WORK/openssl" \
            -Wl,-rpath,"$PEER_WORK/openssl" -lssl -lcrypto -o "$PEER_WORK/openssl-peer"
          cc -O2 -Wall -Wextra -Werror -I"$PEER_WORK/bssl/include" \
            testdata/interop/openssl.c "$PEER_WORK/bssl-build/libssl.a" \
            "$PEER_WORK/bssl-build/libcrypto.a" -lstdc++ -pthread -o "$PEER_WORK/bssl-peer"
          cc -O2 -Wall -Wextra -Werror -I"$PEER_WORK/dist/public/nss" \
            $(pkg-config --cflags nspr) testdata/interop/nss.c \
            -L"$nsslib" -Wl,-rpath,"$nsslib" -lssl3 -lnss3 -lnssutil3 -lsmime3 \
            $(pkg-config --libs nspr) -o "$PEER_WORK/nss-peer"
          echo "nsslib=$nsslib" >> "$GITHUB_OUTPUT"
      - name: Save DTLS 1.3 peer build cache
        if: steps.build_dtls_peers.outcome == 'success' && steps.cache-dtls-peers.outcome == 'success' && steps.cache-dtls-peers.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/dtls13-peers
          key: ${{ steps.cache-dtls-peers.outputs.cache-primary-key }}
      - name: Run NSS, BoringSSL, and OpenSSL four-direction benchmarks
        id: dtls_peer_bench
        if: steps.build_dtls_peers.outcome == 'success'
        continue-on-error: true
        env:
          PEER_WORK: ${{ runner.temp }}/dtls13-peers
          NSS_LIB: ${{ steps.build_dtls_peers.outputs.nsslib }}
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
          go list -mod=readonly -deps ./... >/dev/null
          test "$(git -C "$PEER_WORK/nss" rev-parse HEAD)" = b9283c1e4ee232b4450d36115272af670d38ec81
          test "$(git -C "$PEER_WORK/bssl" rev-parse HEAD)" = 4f3b183c5d4a8f8fcaba4c0ab4435df181df6978
          test "$(git -C "$PEER_WORK/openssl" rev-parse HEAD)" = 41eecc7c7cd4069b1b29bca49b9d97825c6bf648
          test -x "$PEER_WORK/nss-peer" && test -x "$PEER_WORK/bssl-peer" && test -x "$PEER_WORK/openssl-peer"
          export DTLS13_NSS_PEER="$PEER_WORK/nss-peer"
          export DTLS13_BORINGSSL_PEER="$PEER_WORK/bssl-peer"
          export DTLS13_OPENSSL_PEER="$PEER_WORK/openssl-peer"
          export LD_LIBRARY_PATH="$NSS_LIB:$PEER_WORK/openssl"
          output="$RUNNER_TEMP/benchmark-output/benchmark.txt"
          printf 'nss: %s (Linux Release)\n' b9283c1e4ee232b4450d36115272af670d38ec81 >> "$output"
          printf 'boringssl: %s (Linux Release)\n' 4f3b183c5d4a8f8fcaba4c0ab4435df181df6978 >> "$output"
          printf 'openssl: %s (Linux Release)\n' 41eecc7c7cd4069b1b29bca49b9d97825c6bf648 >> "$output"
          go test . -run '^$' -bench '^BenchmarkDTLS13PeerRealUDP$' \
            -benchmem -benchtime=1x -count=5 -cpu=1 -timeout=45m -json | tee -a "$output"
      - name: Validate complete real UDP benchmark matrices
        id: matrix_validation
        if: steps.peer_bench.outcome == 'success' && steps.dtls_peer_bench.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local
          go list -mod=readonly -deps ./... >/dev/null
          go run ./tools/benchmark-report \
            -input "$RUNNER_TEMP/benchmark-output/benchmark.txt" \
            -output "$RUNNER_TEMP/benchmark-output/validated.md" \
            -language en -language-links=false
          rm "$RUNNER_TEMP/benchmark-output/validated.md"
      - name: Format and sort benchmark report
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/benchmark-output"
          trap 'rm -f "$output_dir/README.md" "$output_dir/benchmark.en.md" "$output_dir/benchmark.ru.md"' ERR
          test -f "$output_dir/benchmark.txt"
          tool="$RUNNER_TEMP/benchmark-report"
          go build -o "$tool" ./tools/benchmark-report
          common=(
            -input "$output_dir/benchmark.txt"
            -commit "$(git rev-parse HEAD)"
            -generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            -allow-partial
          )
          "$tool" "${common[@]}" -language zh-CN -output "$output_dir/README.md"
          "$tool" "${common[@]}" -language en -output "$output_dir/benchmark.en.md"
          "$tool" "${common[@]}" -language ru -output "$output_dir/benchmark.ru.md"
          cat "$output_dir/README.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Record benchmark status
        id: status
        if: always()
        shell: bash
        run: |
          output_dir="$RUNNER_TEMP/benchmark-output"
          mkdir -p "$output_dir"
          if [[ "${{ steps.go_bench.outcome }}" == success &&
                "${{ steps.wolfssl.outcome }}" == success &&
                "${{ steps.build_wolfssl.outcome }}" == success &&
                "${{ steps.peer_bench.outcome }}" == success &&
                "${{ steps.build_dtls_peers.outcome }}" == success &&
                "${{ steps.dtls_peer_bench.outcome }}" == success &&
                "${{ steps.matrix_validation.outcome }}" == success &&
                "${{ steps.report.outcome }}" == success ]]; then
            echo complete > "$output_dir/benchmark-status.txt"
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo partial > "$output_dir/benchmark-status.txt"
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            echo 'Some benchmark data is unavailable; see the raw artifact and step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-output
          path: |
            ${{ runner.temp }}/benchmark-output/README.md
            ${{ runner.temp }}/benchmark-output/benchmark.en.md
            ${{ runner.temp }}/benchmark-output/benchmark.ru.md
            ${{ runner.temp }}/benchmark-output/benchmark.txt
            ${{ runner.temp }}/benchmark-output/benchmark-status.txt
          retention-days: 30
          if-no-files-found: warn

  publish:
    name: publish master results
    if: >-
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master')) &&
      needs.benchmark.outputs.complete == 'true'
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-output
          path: report
      - name: Update benchmark-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/benchmark-results"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone --depth 1 --branch benchmark-results "$remote" "$target"; then
            rm -rf "$target"
            git init -b benchmark-results "$target"
            git -C "$target" remote add origin "$remote"
          fi
          cp report/README.md "$target/README.md"
          cp report/benchmark.en.md report/benchmark.ru.md "$target/"
          cp report/benchmark.txt "$target/benchmark.txt"
          printf '\n[Go benchmark 原始输出](benchmark.txt)\n' >> "$target/README.md"
          printf '\n[Raw Go benchmark output](benchmark.txt)\n' >> "$target/benchmark.en.md"
          printf '\n[Исходный вывод Go benchmark](benchmark.txt)\n' >> "$target/benchmark.ru.md"
          git -C "$target" rm -f --ignore-unmatch benchmark.md
          git -C "$target" config user.name github-actions[bot]
          git -C "$target" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$target" add README.md benchmark.en.md benchmark.ru.md benchmark.txt
          if git -C "$target" diff --cached --quiet; then
            exit 0
          fi
          git -C "$target" commit -m "bench(results): update for ${GITHUB_SHA}"
          git -C "$target" push origin HEAD:benchmark-results
