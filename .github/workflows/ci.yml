name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [format, module, lint, test, shuffle, checkptr, vet, race]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify checkout credentials are not persisted
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          ! git config --local --get-regexp '^http\..*\.extraheader$'
          ! git remote get-url origin | grep -Eq '(x-access-token|github_pat_|gh[opsu]_)'
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        if: matrix.check == 'format'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 fmt --diff
      - name: Module
        if: matrix.check == 'module'
        run: |
          go mod verify
          go mod tidy -diff
      - name: Lint
        if: matrix.check == 'lint'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
      - name: Test
        if: matrix.check == 'test'
        run: go test ./... -count=1
      - name: Shuffle
        if: matrix.check == 'shuffle'
        run: go test ./... -shuffle=on -count=1
      - name: Checkptr
        if: matrix.check == 'checkptr'
        run: go test ./... -gcflags=all=-d=checkptr=2 -count=1
      - name: Vet
        if: matrix.check == 'vet'
        run: go vet ./...
      - name: Race
        if: matrix.check == 'race'
        run: go test -race ./... -count=1
