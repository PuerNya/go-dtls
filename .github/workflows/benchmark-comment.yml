name: Benchmark PR Report

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: benchmark-output
          path: report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Generate trusted PR report
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c %s report/benchmark.txt)" -le 10485760
          go run ./tools/benchmark-report \
            -input report/benchmark.txt \
            -output report/comment.md \
            -commit "${{ github.event.workflow_run.head_sha }}" \
            -generated "${{ github.event.workflow_run.updated_at }}"
      - name: Update pull request comment
        uses: actions/github-script@v9
        env:
          REPORT_PATH: report/comment.md
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- go-dtls-benchmark-report -->'
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8')
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`
            const body = `${marker}\n${report}\n\n[Workflow run](${runURL})`
            if (Buffer.byteLength(body, 'utf8') > 65000) {
              core.setFailed('benchmark report exceeds the GitHub comment size limit')
              return
            }
            const issue_number = context.payload.workflow_run.pull_requests[0].number
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }
