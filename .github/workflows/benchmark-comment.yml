name: Benchmark PR Report

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check benchmark artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            })
            const matching = artifacts.filter(artifact => artifact.name === 'benchmark-output' && !artifact.expired)
            const validSize = matching.length === 1 && Number.isSafeInteger(matching[0].size_in_bytes) && matching[0].size_in_bytes >= 0
            const found = validSize && matching[0].size_in_bytes <= 67108864
            if (matching.length > 1 || (matching.length === 1 && !found)) {
              core.setFailed('benchmark artifact is duplicated or exceeds 64 MiB')
            }
            const pull = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.workflow_run.pull_requests[0].number,
            })
            const workloadApproved = pull.data.labels.some(label => label.name === 'performance-workload-approved')
            core.setOutput('available', found ? 'true' : 'false')
            core.setOutput('allow-workload-change', workloadApproved ? 'true' : 'false')
      - uses: actions/checkout@v7
        if: steps.artifact.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: steps.artifact.outputs.available == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        if: steps.artifact.outputs.available == 'true'
        with:
          name: benchmark-output
          path: report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Format and sort trusted PR report
        if: steps.artifact.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'README.md\nbenchmark-base.txt\nbenchmark-comparison.md\nbenchmark-head.txt\nbenchmark.en.md\nbenchmark.ru.md\nbenchmark.txt\nperformance-gate-status.txt'
          actual="$(find report -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          test "$(find report -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ""
          test "$(find report -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')" -le 67108864
          test "$(find report -type f -size +16777216c -print -quit)" = ""
          test "$(stat -c %s report/benchmark.txt)" -le 10485760
          test "$(stat -c %s report/benchmark-base.txt)" -le 8388608
          test "$(stat -c %s report/benchmark-head.txt)" -le 8388608
          test "$(stat -c %s report/performance-gate-status.txt)" -le 16
          go run ./tools/benchmark-report \
            -input report/benchmark.txt \
            -output report/comment.md \
            -commit "${{ github.event.workflow_run.head_sha }}" \
            -generated "${{ github.event.workflow_run.updated_at }}" \
            -language zh-CN \
            -language-links=false
          if [[ -f report/benchmark-base.txt && -f report/benchmark-head.txt ]]; then
            set +e
            go run ./tools/benchmark-report \
              -baseline report/benchmark-base.txt \
              -candidate report/benchmark-head.txt \
              -output report/comparison.md \
              -language zh-CN \
              -minimum-pairs 9 \
              -allow-workload-change "${{ steps.artifact.outputs.allow-workload-change }}" \
              -fail-on-regression=false
            status=$?
            set -e
            if (( status != 0 )); then
              printf '## PR base/head 配对性能门禁\n\n结论：`FAIL`。比较输入不完整或格式无效，请查看 Workflow run。\n' > report/comparison.md
            fi
            cat report/comparison.md >> report/comment.md
          fi
      - name: Update pull request comment
        if: always()
        uses: actions/github-script@v9
        env:
          REPORT_PATH: report/comment.md
          ARTIFACT_AVAILABLE: ${{ steps.artifact.outputs.available }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- go-dtls-benchmark-report -->'
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`
            const report = process.env.ARTIFACT_AVAILABLE === 'true' && fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : `## Benchmark workflow failed\n\n结论：\`${process.env.WORKFLOW_CONCLUSION}\`。未生成完整 benchmark artifact，请查看 [Workflow run](${runURL})。`
            const body = `${marker}\n${report}\n\n[Workflow run](${runURL})`
            if (Buffer.byteLength(body, 'utf8') > 65000) {
              core.setFailed('benchmark report exceeds the GitHub comment size limit')
              return
            }
            const issue_number = context.payload.workflow_run.pull_requests[0].number
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }
