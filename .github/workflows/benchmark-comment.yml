name: Benchmark PR Report

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check benchmark artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            })
            const matching = artifacts.filter(artifact => artifact.name === 'benchmark-output' && !artifact.expired)
            const validSize = matching.length === 1 && Number.isSafeInteger(matching[0].size_in_bytes) && matching[0].size_in_bytes >= 0
            const found = validSize && matching[0].size_in_bytes <= 67108864
            if (matching.length > 1 || (matching.length === 1 && !found)) {
              core.setFailed('benchmark artifact is duplicated or exceeds 64 MiB')
            }
            core.setOutput('available', found ? 'true' : 'false')
      - uses: actions/checkout@v7
        if: steps.artifact.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: steps.artifact.outputs.available == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        if: steps.artifact.outputs.available == 'true'
        with:
          name: benchmark-output
          path: report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate benchmark artifact
        id: validate
        if: steps.artifact.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status_only='benchmark-status.txt'
          minimal=$'benchmark-status.txt\nbenchmark.txt'
          complete=$'README.md\nbenchmark-status.txt\nbenchmark.en.md\nbenchmark.ru.md\nbenchmark.txt'
          actual="$(find report -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)"
          [[ "$actual" == "$status_only" || "$actual" == "$minimal" || "$actual" == "$complete" ]]
          test "$(find report -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ""
          test "$(find report -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')" -le 67108864
          test "$(find report -type f -size +16777216c -print -quit)" = ""
          test "$(stat -c %s report/benchmark-status.txt)" -le 16
          status="$(cat report/benchmark-status.txt)"
          [[ "$status" == complete || "$status" == partial ]]
          if [[ "$actual" != "$complete" ]]; then
            [[ "$status" == partial ]]
          fi
          if [[ "$actual" != "$status_only" ]]; then
            test "$(stat -c %s report/benchmark.txt)" -le 10485760
            echo 'data=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Format and sort trusted PR report
        if: steps.validate.outputs.data == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          go run ./tools/benchmark-report \
            -input report/benchmark.txt \
            -output report/comment.tmp.md \
            -commit "${{ github.event.workflow_run.head_sha }}" \
            -generated "${{ github.event.workflow_run.updated_at }}" \
            -language zh-CN \
            -language-links=false \
            -allow-partial
          if [[ "$(cat report/benchmark-status.txt)" == partial ]]; then
            printf '\n部分 benchmark 步骤未完成；上表仅包含实际取得的样本。\n' >> report/comment.tmp.md
          fi
          mv report/comment.tmp.md report/comment.md
      - name: Update pull request comment
        if: always()
        uses: actions/github-script@v9
        env:
          REPORT_PATH: report/comment.md
          ARTIFACT_AVAILABLE: ${{ steps.artifact.outputs.available }}
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- go-dtls-benchmark-report -->'
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.payload.workflow_run.id}`
            const report = process.env.ARTIFACT_AVAILABLE === 'true' && fs.existsSync(process.env.REPORT_PATH)
              ? fs.readFileSync(process.env.REPORT_PATH, 'utf8')
              : `## Benchmark 数据暂不可用\n\n本次未生成可展示的数据，请查看 [Workflow run](${runURL})。`
            const body = `${marker}\n${report}\n\n[Workflow run](${runURL})`
            if (Buffer.byteLength(body, 'utf8') > 65000) {
              core.setFailed('benchmark report exceeds the GitHub comment size limit')
              return
            }
            const issue_number = context.payload.workflow_run.pull_requests[0].number
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            })
            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            )
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              })
            }
