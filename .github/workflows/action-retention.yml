name: Clean Up Action Runs

on:
  push:
  schedule:
    # 21:00 UTC is 05:00 in Asia/Shanghai.
    - cron: '0 21 * * *'

permissions:
  actions: write

concurrency:
  group: action-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Retain active runs and one successful run per workflow
        uses: actions/github-script@v9
        with:
          script: |
            const listed = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { ...context.repo, per_page: 100 },
            )
            const runs = [...new Map(listed.map(run => [run.id, run])).values()]
            const retained = new Set()
            const remove = []
            const isCurrent = run => String(run.id) === String(context.runId)
            const completed = runs
              .filter(run => !isCurrent(run) && run.status === 'completed')
              .sort((a, b) =>
                Date.parse(b.created_at) - Date.parse(a.created_at) || b.id - a.id,
              )
            for (const run of completed) {
              if (run.conclusion === 'success' && !retained.has(run.workflow_id)) {
                retained.add(run.workflow_id)
              } else {
                remove.push(run)
              }
            }
            if (remove.some(run => isCurrent(run) || run.status !== 'completed')) {
              throw new Error('refusing to delete an active or current run')
            }
            const batchSize = 10
            for (let offset = 0; offset < remove.length; offset += batchSize) {
              await Promise.all(remove.slice(offset, offset + batchSize).map(run =>
                github.rest.actions.deleteWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                }),
              ))
              if (offset + batchSize < remove.length) {
                // Pace DELETE requests to avoid GitHub's secondary rate limit.
                await new Promise(resolve => setTimeout(resolve, 4000))
              }
            }
            core.info(`Retained all active runs and ${retained.size} successful runs; deleted ${remove.length} completed runs.`)
