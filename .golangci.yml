version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godoclint
    - godot
    - gosec
    - goprintffuncname
    - misspell
    - modernize
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - reassign
    - recvcheck
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - badLock
        - badCond
        - badCall
        - badSyncOnceFunc
        - dupArg
        - dupCase
        - exitAfterDefer
        - offBy1
    gosec:
      # Wire encoders intentionally narrow values to their RFC field widths.
      excludes:
        - G115
    govet:
      enable:
        - nilness
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        text: "Close.*is not checked"
        source: '^\s*defer .*\.Close\(\)\s*$'
        linters:
          - errcheck
      - path: connection_id_test\.go
        text: 'registerConnectionIDs - result 0 \(error\) is always nil'
        linters:
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/puernya/go-dtls

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
